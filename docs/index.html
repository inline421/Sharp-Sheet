  *{box-sizing:border-box;}

  h1{font-size:1.3rem; font-weight:700; margin:0; letter-spacing:-0.01em;}
  .asof{font-size:.78rem; color:var(--muted);}
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px;}
  .tile{background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .tile .label{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
  .tile .value{font-size:1.4rem; font-weight:700; margin-top:2px; font-variant-numeric:proportional-nums;}
  .tile .value.good{color:var(--good);}
  .tile .value.critical{color:var(--critical);}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  select{
    font:inherit; font-size:.8rem; padding:6px 10px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface-1); color:var(--text-1);
  }
  table{width:100%; border-collapse:collapse; background:var(--surface-1); border:1px solid var(--border); border-radius:10px; overflow:hidden; font-size:.83rem;}
  thead th{
    text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
    padding:9px 10px; border-bottom:1px solid var(--grid); font-weight:600; white-space:nowrap;
  }
  tbody td{padding:9px 10px; border-bottom:1px solid var(--grid); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .mono{font-variant-numeric:tabular-nums;}
  .sub{color:var(--text-2); font-size:.78rem;}
  .badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:.72rem; font-weight:600;}
  .badge.win{background:var(--good-soft); color:var(--good);}
  .badge.loss{background:var(--critical-soft); color:var(--critical);}
  .badge.push{background:var(--muted-soft); color:var(--text-2);}
  .badge.pending{background:var(--warning-soft); color:#9a6a00;}
  @media (prefers-color-scheme: dark){ .badge.pending{color:var(--warning);} }
  :root[data-theme="dark"] .badge.pending{color:var(--warning);}
  .badge.void{background:var(--muted-soft); color:var(--muted);}
  .tierpill{font-size:.7rem; color:var(--muted);}
  footer{margin-top:22px; font-size:.72rem; color:var(--muted);}
  .empty{padding:30px; text-align:center; color:var(--muted);}
  @media (max-width:640px){
    table, thead, tbody, tr{display:block;}
    thead{display:none;}
    tbody tr{border-bottom:1px solid var(--grid); padding:10px 0;}
    tbody td{border:none; padding:2px 0;}
    tbody td[data-label]::before{content:attr(data-label); display:block; font-size:.65rem; text-transform:uppercase; color:var(--muted); letter-spacing:.05em;}
  }
</style>
</head>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('sharp-data').textContent);
  var picks = DATA.picks.slice().sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  var s = DATA.summary;

  document.getElementById('asof').textContent = 'As of ' + s.asOf;

  var tiles = document.getElementById('tiles');
  function tile(label, value, cls){
    var d = document.createElement('div'); d.className = 'tile';
    d.innerHTML = '<div class="label">'+label+'</div><div class="value'+(cls?' '+cls:'')+'">'+value+'</div>';
    tiles.appendChild(d);
  }
  tile('Record', s.record);
  tile('Net units', (s.netUnits>0?'+':'') + s.netUnits.toFixed(2) + 'u', s.netUnits>0?'good':s.netUnits<0?'critical':'');
  if (s.pending) tile('Pending', s.pending);
  tile('Unit size', '$' + s.unit.toLocaleString());

  var sports = Array.from(new Set(picks.map(function(p){return p.sport;}))).sort();
  var fSport = document.getElementById('fSport');
  sports.forEach(function(sp){
    var o = document.createElement('option'); o.value = sp; o.textContent = sp; fSport.appendChild(o);
  });

  function fmtOdds(o){ return (o>0?'+':'') + o; }
  function tierLabel(key){
    var t = DATA.tiers.find(function(t){return t.key===key;});
    return t ? t.label : key;
  }
  function resultText(p){
    if (p.status === 'win') return 'WIN' + (p.margin!=null ? ' (+'+p.margin+(p.marginUnit||'')+')' : '');
    if (p.status === 'loss') return 'LOSS' + (p.margin!=null ? ' ('+p.margin+(p.marginUnit||'')+')' : '');
    if (p.status === 'push') return 'PUSH';
    if (p.status === 'pending') return 'Pending';
    if (p.status === 'void') return 'Void';
    return p.status;
  }

  var rowsEl = document.getElementById('rows');
  var emptyEl = document.getElementById('empty');

  function render(){
    var sport = fSport.value, status = document.getElementById('fStatus').value;
    var shown = picks.filter(function(p){
      return (!sport || p.sport===sport) && (!status || p.status===status);
    });
    rowsEl.innerHTML = '';
    emptyEl.hidden = shown.length > 0;
    shown.forEach(function(p){
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td data-label="Date" class="mono sub">'+p.date+'</td>'+
        '<td data-label="Matchup"><div>'+p.matchup+'</div><div class="sub">'+p.sport+' · '+p.market+'</div></td>'+
        '<td data-label="Pick">'+p.selection+'</td>'+
        '<td data-label="Line" class="mono">'+fmtOdds(p.odds)+'<div class="sub">'+p.book+'</div></td>'+
        '<td data-label="Tier"><span class="tierpill">'+tierLabel(p.tier)+' · '+p.units+'u</span></td>'+
        '<td data-label="Result"><span class="badge '+p.status+'">'+resultText(p)+'</span></td>';
      rowsEl.appendChild(tr);
    });
  }
  fSport.addEventListener('change', render);
  document.getElementById('fStatus').addEventListener('change', render);
  render();
})();
</script>
