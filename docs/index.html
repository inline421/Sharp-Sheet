    --border: rgba(255,255,255,0.10); --line: rgba(255,255,255,0.07);

  *{box-sizing:border-box;}

  .asof{font-size:.78rem; color:var(--muted); margin-top:2px;}

  .tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}

  .tile .value{font-size:1.3rem; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums;}

  .badge.pending{background:var(--warn-soft); color:var(--warn);}
  .badge.conditional{background:var(--warn-soft); color:var(--warn); border:1px dashed var(--warn);}
  .badge.go{background:var(--good-soft); color:var(--good);}
  .badge.nogo{background:var(--muted-soft); color:var(--muted);}

  .card.open .chev{transform:rotate(90deg);}
  .hint{font-size:.72rem; color:var(--warn); margin-top:6px;}

  .d-v{font-size:.86rem; color:var(--text-2); line-height:1.45;}
  .d-v b{color:var(--text-1);}
  .note{font-size:.78rem; color:var(--text-2); background:var(--warn-soft); border-radius:10px; padding:8px 10px; margin:0 0 8px;}
  .more{display:block; width:100%; margin-top:10px; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text-2); font:inherit; font-size:.82rem; cursor:pointer;}
  .empty{padding:28px; text-align:center; color:var(--muted); font-size:.85rem;}
  .ctl{display:flex; gap:8px; margin-bottom:10px;}

  .ctl-btn .n{background:var(--accent); color:#fff; border-radius:999px; font-size:.68rem; padding:1px 7px;}
  .ctl-btn.reset{flex:0 0 auto; font-weight:500; color:var(--text-2);}
  .panel{display:none; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:4px 12px 12px; margin-bottom:12px;}
  .panel.open{display:block;}
  .f-row{padding-top:10px;}
  .f-label{font-size:.64rem; font-weight:650; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:6px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; border:1px solid var(--border); background:var(--plane); color:var(--text-2); border-radius:999px; padding:6px 12px; font:inherit; font-size:.8rem; font-weight:550; cursor:pointer; white-space:nowrap;}

  .panel select{width:100%;}
  .sumbar{display:flex; flex-wrap:wrap; gap:4px 14px; align-items:baseline; font-size:.8rem; color:var(--text-2); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:9px 12px; margin-bottom:6px;}
  .sumbar b{color:var(--text-1); font-variant-numeric:tabular-nums;}
  .pos{color:var(--good)!important;} .neg{color:var(--bad)!important;}

  .pl{font-variant-numeric:tabular-nums; font-weight:650; margin-left:6px;}
  footer{margin-top:24px; font-size:.72rem; color:var(--muted); text-align:center;}
</style>
</head>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('sharp-data').textContent);
  var s = DATA.summary, ALL = DATA.picks;
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtOdds(o){ return (o>0?'+':'')+o; }
  function tierLabel(k){ var t=(DATA.tiers||[]).find(function(t){return t.key===k;}); return t?t.label:k; }
  function niceDate(d){ var dt=new Date(d+'T12:00:00'); return dt.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'}); }
  function cleanSel(p){ return String(p.selection).replace(/\s+—\s+CONDITIONAL.*$/,''); }
  function isOpen(p){ return p.status==='pending'||p.status==='conditional'; }

  document.getElementById('asof').textContent='Updated '+s.asOf;
  var tiles=document.getElementById('tiles');
  function tile(l,v,c){ tiles.insertAdjacentHTML('beforeend','<div class="tile"><div class="label">'+l+'</div><div class="value'+(c?' '+c:'')+'">'+v+'</div></div>'); }
  tile('Record',s.record);
  tile('Net units',(s.netUnits>0?'+':'')+s.netUnits.toFixed(2)+'u',s.netUnits>0?'good':s.netUnits<0?'bad':'');
  var nOpen=ALL.filter(isOpen).length;
  tile('Upcoming',nOpen);
  tile('Unit size','$'+s.unit.toLocaleString());

  var fSport=document.getElementById('fSport'), fStatus=document.getElementById('fStatus');
  Array.from(new Set(ALL.map(function(p){return p.sport;}))).sort().forEach(function(sp){ fSport.insertAdjacentHTML('beforeend','<option value="'+esc(sp)+'">'+esc(sp)+'</option>'); });

  function badge(p){
    if(p.status==='conditional'){ var d=p.cond&&p.cond.decision; return d==='GO'?'<span class="badge go">GO</span>':d==='NO-GO'?'<span class="badge nogo">No-go</span>':'<span class="badge conditional">Conditional</span>'; }
    if(p.cond&&p.cond.decision==='GO'&&p.status==='pending') return '<span class="badge go">GO · Pending</span>';
    if(p.cond&&p.cond.decision==='NO-GO') return '<span class="badge nogo">No-go</span>';
    var m={win:'Win',loss:'Loss',push:'Push',pending:'Pending',void:'Void'}[p.status]||p.status;
    var mg=(p.status==='win'||p.status==='loss')&&p.margin!=null?' '+(p.status==='win'?'+':'')+p.margin+(p.marginUnit?' '+p.marginUnit:''):'';
    return '<span class="badge '+esc(p.status)+'">'+m+mg+'</span>';
  }
  function stake(p){
    if(p.cond&&p.cond.decision==='NO-GO') return '<span class="stake">No bet</span>';
    var u='<b>'+p.units+'u</b>';
    return '<span class="stake">'+esc(tierLabel(p.tier))+' · '+u+(p.status==='conditional'?' if GO':'')+'</span>';
  }
  function detail(p){
    var c=p.cond; if(!c) return '';
    var h='';
    if(c.decision) h+='<div class="d-item"><div class="d-k">Call</div><div class="d-v"><b>'+esc(c.decision)+'</b>'+(c.reading?' — '+esc(c.reading):'')+'</div></div>';
    h+='<div class="d-item"><div class="d-k">Call time</div><div class="d-v">'+esc(c.callAt)+'</div></div>';
    h+='<div class="d-item"><div class="d-k go">Go if</div><div class="d-v">'+esc(c.go)+'</div></div>';
    h+='<div class="d-item"><div class="d-k nogo">No-go if</div><div class="d-v">'+esc(c.noGo)+'</div></div>';
    h+='<div class="d-item"><div class="d-k">Price</div><div class="d-v">'+esc(c.price)+'</div></div>';
    if(c.why) h+='<div class="d-item"><div class="d-k">Why</div><div class="d-v">'+esc(c.why)+'</div></div>';
    return h;
  }
  function card(p){
    var det=detail(p), cls='card'+(det?' has-detail':'')+(p.status==='conditional'&&!(p.cond&&p.cond.decision)?' cond':'')+(p.cond&&p.cond.decision==='GO'?' go':'');
    var hint=(p.status==='conditional'&&!(p.cond&&p.cond.decision))?'<div class="hint">Not a bet yet — tap for the go / no-go rules</div>':'';
    return '<div class="'+cls+'"><button class="row" type="button"'+(det?' aria-expanded="false"':' tabindex="-1"')+'>'+
      '<div class="r1"><span class="meta">'+esc(p.sport)+' · '+esc(p.matchup)+' · '+niceDate(p.date)+'</span>'+badge(p)+'</div>'+
      '<div class="pick">'+esc(cleanSel(p))+(det?'<span class="chev">›</span>':'')+'</div>'+
      '<div class="r3"><span class="odds"><b>'+fmtOdds(p.odds)+'</b> · '+esc(p.book)+'</span>'+stake(p)+'</div>'+hint+
      '</button>'+(det?'<div class="detail">'+det+'</div>':'')+'</div>';
  }
  var out=document.getElementById('out'), limit=25;
  function render(){
    var sp=fSport.value, st=fStatus.value;
    var shown=ALL.filter(function(p){ return (!sp||p.sport===sp)&&(!st||(st==='open'?isOpen(p):p.status===st)); });
    var open=shown.filter(isOpen).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
    var done=shown.filter(function(p){return !isOpen(p);}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
    var h='';
    if(open.length){
      h+='<div class="group-h"><span>Upcoming</span><span>'+open.length+'</span></div>';
      if(open.some(function(p){return p.status==='conditional';})) h+='<p class="note">Picks marked <b>Conditional</b> aren\'t bets yet. Each gets a go / no-go call about an hour before kickoff, and this page updates when it\'s made.</p>';
      h+='<div class="list">'+open.map(card).join('')+'</div>';
    }
    if(done.length){
      h+='<div class="group-h"><span>Results</span><span>'+done.length+'</span></div><div class="list">'+done.slice(0,limit).map(card).join('')+'</div>';
      if(done.length>limit) h+='<button class="more" type="button" id="more">Show more ('+(done.length-limit)+')</button>';
    }
    out.innerHTML=h||'<div class="empty">No picks match this filter.</div>';
  }
  out.addEventListener('click',function(e){
    if(e.target.id==='more'){ limit+=50; render(); return; }
    var c=e.target.closest('.card.has-detail'); if(!c||!e.target.closest('.row')) return;
    var o=c.classList.toggle('open'); c.querySelector('.row').setAttribute('aria-expanded',String(o));
  });
  fSport.addEventListener('change',function(){limit=25;render();});
  fStatus.addEventListener('change',function(){limit=25;render();});
  render();
})();
</script>
